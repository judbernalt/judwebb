name: Sync Projects Index

on:
  push:
    paths:
      - 'data/projects/*.json'
      - '!data/projects/index.json'
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      
      - name: Sync projects index
        run: bash scripts/sync-projects-index.sh
      
      - name: Check if index changed
        id: check
        run: |
          if git diff --quiet data/projects/index.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Sync Bot"
          git add data/projects/index.json
          git commit -m "chore: auto-sync projects index"
          git push
